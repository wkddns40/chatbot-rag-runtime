name: Runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 setup.py
      - run: python3 scripts/check_public.py
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T app python -m unittest discover -s tests -v
      - if: always()
        run: docker compose down
